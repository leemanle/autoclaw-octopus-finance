# 飞书机器人配置模板
# 使用说明：
# 1. 将此文件复制为 feishu.yml
# 2. 替换下面的占位符为实际值
# 3. 将文件保存到配置目录

# 启用飞书频道
enabled: true

# ============================================================================
# 必填项：从飞书开放平台获取
# ============================================================================
appId: "cli_a1b2c3d4e5f6g7h8"      # ← 替换为你的 App ID
appSecret: "xxxxxxxxxxxxxxxx"       # ← 替换为你的 App Secret

# ============================================================================
# 机器人配置
# ============================================================================
robot:
  openId: "ou_xxxxxxxxxxxxxxxxx"   # ← 替换为机器人的 open_id
  name: "AutoClaw"                  # 机器人在飞书中的显示名称

# ============================================================================
# 加密配置（通常留空即可）
# ============================================================================
encryptKey: ""
verificationToken: ""

# ============================================================================
# 事件订阅配置（Webhook 模式）
# 如果你有公网服务器，可以启用此模式
# ============================================================================
events:
  enabled: false                    # 是否启用 webhook 模式
  url: "https://your-domain.com/webhook/feishu"  # 你的公网 URL
  secret: "your-webhook-secret"     # Webhook 验证密钥

# ============================================================================
# 轮询配置（Polling 模式，推荐）
# 无需公网服务器，适合个人使用
# ============================================================================
polling:
  enabled: true                     # 启用轮询模式
  interval: 3000                    # 轮询间隔（毫秒）= 3 秒

# ============================================================================
# 功能开关
# ============================================================================
features:
  receiveMessages: true             # 接收消息
  sendMessages: true                # 发送消息
  replyMentions: true               # 回复@提及
  supportGroups: true               # 支持群组
  supportDirect: true               # 支持私聊
  uploadFiles: true                 # 上传文件
  downloadFiles: true               # 下载文件
  reactions: true                   # 表情回应
  typingIndicator: true             # 输入状态提示

# ============================================================================
# 日志配置
# ============================================================================
logging:
  enabled: true                     # 启用日志
  level: "info"                     # 日志级别：debug, info, warn, error
  file: "feishu.log"                # 日志文件名

# ============================================================================
# 调试模式
# ============================================================================
debug: false
